[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "0.1.0"
description = "JARVIS — a production-grade personal AI assistant for Windows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "anthropic>=0.40.0",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "rich>=13.7",
]

[project.optional-dependencies]
voice = ["sounddevice>=0.4.6", "numpy>=1.26", "deepgram-sdk>=3.2",
         "elevenlabs>=1.0", "faster-whisper>=1.0", "pyttsx3>=2.90"]
desktop = ["psutil>=5.9", "pyautogui>=0.9.54", "mss>=9.0", "send2trash>=1.8"]
web = ["trafilatura>=1.8", "tavily-python>=0.3"]
music = ["spotipy>=2.23"]
ui = ["PySide6>=6.6"]
full = ["jarvis-assistant[voice,desktop,web,music,ui]", "APScheduler>=3.10"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]
